# ==============================================================================
# Nginx — Proxy inverso para Salud-Conecta IA
# Recibe todo el tráfico web (80/443) y lo reenvía al contenedor app:3000.
# El código NUNCA se expone directamente a internet.
# ==============================================================================

# Redirigir HTTP → HTTPS
server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge (para obtener/renovar certificado)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Proxy inverso HTTPS
server {
    listen 443 ssl;
    server_name scia-vm-salud-conecta.northcentralus.cloudapp.azure.com;

    # Certificados (montados desde ./nginx/certbot/conf)
    # NOTA: nginx NO permite variables en ssl_certificate.
    # Reemplaza "tu-dominio" por tu dominio real ANTES de levantar.
    ssl_certificate     /etc/letsencrypt/live/scia-vm-salud-conecta.northcentralus.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scia-vm-salud-conecta.northcentralus.cloudapp.azure.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Seguridad de transporte
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Tamaño de cuerpo (la app acepta hasta 12 MB)
    client_max_body_size 12m;

    # Compresión de respuestas
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Proxy al contenedor app
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        # Encabezados para que Express vea la URL real
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte para SSE / WebSockets (notificaciones push)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
