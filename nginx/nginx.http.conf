# Respaldo HTTP usado solamente mientras se obtiene o recupera el certificado TLS.
# Mantiene la aplicacion accesible y permite el desafio ACME sin dejar una pagina
# temporal expuesta indefinidamente.
server {
    listen 80;
    server_name scia-vm-salud-conecta.northcentralus.cloudapp.azure.com _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Evita el redirect a un HTTPS que aun no esta disponible. Este modo es
        # solo de recuperacion; al obtener el certificado se reemplaza por nginx.conf.
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
