name: Security Audit & SSDLC Checks

on:
  push:
    branches:
      - main
      - master
      - Security-Banch
      - dev
  pull_request:
    branches:
      - main
      - master
      - Security-Banch
      - dev

permissions:
  contents: read
  security-events: write

jobs:
  npm-security-audit:
    name: NPM Dependency Vulnerability Audit (OWASP A06)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run NPM Security Audit (Fail on High/Critical)
        run: |
          echo "Running npm audit to check for HIGH and CRITICAL vulnerabilities..."
          npm audit --audit-level=high

      - name: Static Type Check & Security Integrity
        run: |
          echo "Verifying TypeScript integrity..."
          npx tsc --noEmit
